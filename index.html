<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/expavio-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Expavio — Your Vision, Our Mission. Corporate services and investor support."
    />
    <title>Expavio</title>
    <link
      rel="preload"
      as="image"
      href="/assets/expavio-logo.webp"
      type="image/webp"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = "light";
        var lang = "ar";

        try {
          theme = localStorage.getItem("expavio-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch (e) {
          theme = "light";
        }

        try {
          var stored = localStorage.getItem("expavio-lang");
          var detected = stored || navigator.language || "ar";
          lang = detected.indexOf("en") === 0 ? "en" : "ar";
        } catch (e) {
          lang = "ar";
        }

        document.documentElement.setAttribute("data-theme", theme);

        // Start fetching the hero image before the app bundle runs, so it is
        // already cached by the time the splash screen fades out.
        var preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.type = "image/png";
        preload.setAttribute("fetchpriority", "high");
        preload.href = "/assets/hero-" + lang + "-" + theme + ".png";
        document.head.appendChild(preload);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
